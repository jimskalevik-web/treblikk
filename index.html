<meta name="robots" content="noindex">
<meta name="description" content="Tre blikk: eleven, hjemmet og skolen svarer hver for seg på de samme spørsmålene og ser hvor de ser det likt og ulikt. Ingen diagnoser, ingen lagring av svar.">

<title>Tre blikk</title>

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: én smal kolonne som en telefonapp. Værskalaen (torden til sol) er den eneste aksen og går igjen i spørsmål og resultat. */
:root{
  --sky:#E8EFF3; --paper:#FAFCFD; --wash:#DAE5EB; --line:#C2D1DA;
  --ink:#13232E; --ink-2:#4B5F6C;
  --sun:#F2B705; --on-sun:#13232E;
  --home:#A93A2C; --on-home:#FFFFFF;
  --school:#1D6B58; --on-school:#FFFFFF;
  --rain:#2F6384; --cloud:#93A9B7; --cloud-2:#5E7686;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#0E1920; --paper:#16242E; --wash:#1E303C; --line:#2E424F;
    --ink:#E9F1F5; --ink-2:#9FB3BF;
    --sun:#F5C427; --on-sun:#13232E;
    --home:#E57B67; --on-home:#13232E;
    --school:#57BFA1; --on-school:#13232E;
    --rain:#84B6D2; --cloud:#A9BECB; --cloud-2:#7C95A4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#0E1920; --paper:#16242E; --wash:#1E303C; --line:#2E424F;
  --ink:#E9F1F5; --ink-2:#9FB3BF;
  --sun:#F5C427; --on-sun:#13232E;
  --home:#E57B67; --on-home:#13232E;
  --school:#57BFA1; --on-school:#13232E;
  --rain:#84B6D2; --cloud:#A9BECB; --cloud-2:#7C95A4;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5}
.wrap{max-width:660px;margin:0 auto;padding-inline:18px;padding-block:20px 48px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.12}
h1{font-size:clamp(28px,7.4vw,38px);font-weight:800;letter-spacing:-.015em}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
a{color:var(--rain)}
:focus-visible{outline:3px solid var(--rain);outline-offset:2px}
#app{display:flex;flex-direction:column;gap:28px;outline:none}
section{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink-2)}
.small{font-size:15px}
.eyebrow{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}

/* språk med andre skrifttegn: ingen sperring, mer luft mellom linjene */
html[lang="ar"] .eyebrow,html[lang="hi"] .eyebrow,html[lang="ar"] .ad-l,html[lang="hi"] .ad-l,html[lang="ar"] h1,html[lang="hi"] h1{letter-spacing:0}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3,html[lang="hi"] h1,html[lang="hi"] h2,html[lang="hi"] h3{line-height:1.4}
html[lang="zh-Hans"] h1,html[lang="zh-Hans"] h2,html[lang="zh-Hans"] h3{line-height:1.3;letter-spacing:0}
html[lang="ar"] body{font-size:18px;line-height:1.7}
html[lang="hi"] body{line-height:1.65}

/* toppen */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:20px;background:none;border:0;color:var(--ink);padding:6px 0;cursor:pointer}
.dots{display:flex}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--sky);margin-inline-start:-6px}
.dots i:first-child{margin-inline-start:0;background:var(--sun)}
.dots i:nth-child(2){background:var(--home)}
.dots i:nth-child(3){background:var(--school)}
.langpick{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);min-width:0}
.langpick svg{flex:none}
.langpick select{min-height:42px;max-width:160px;padding:6px 10px;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:700 15px var(--font-body)}

/* knapper */
.btn{font:700 17px var(--font-body);min-height:48px;padding:10px 20px;border-radius:26px;border:2px solid var(--ink);background:var(--sun);color:var(--on-sun);cursor:pointer}
.btn[disabled]{background:var(--wash);color:var(--ink-2);border-color:var(--line);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* merker for de tre rollene */
.mk{display:inline-grid;place-items:center;flex:none;width:26px;height:26px;border:2px solid var(--paper)}
.mk svg{display:block}
.mk-E{background:var(--sun);color:var(--on-sun);border-radius:50%}
.mk-H{background:var(--home);color:var(--on-home);border-radius:8px}
.mk-S{background:var(--school);color:var(--on-school);border-radius:13px 13px 13px 3px}
.mk.big{width:38px;height:38px;border-color:transparent}
.mk-H.big{border-radius:11px}
.mk-S.big{border-radius:19px 19px 19px 5px}

/* innledning: vilkår som en voksen bekrefter */
.terms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.terms li{display:flex;flex-direction:column;gap:2px;max-width:62ch}
.terms b{font-family:var(--font-display);font-size:19px;line-height:1.25}
.agree{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;gap:14px}

/* forside */
.hero{gap:14px}
.lead{font-size:18px;max-width:58ch}
.sample{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.segb{flex:1 1 96px;min-height:48px;padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);font:700 16px var(--font-body);cursor:pointer;white-space:nowrap}
.segb[aria-pressed="true"]{border-color:var(--ink);background:var(--paper);box-shadow:inset 0 0 0 1px var(--ink)}
.roles{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.roles{grid-template-columns:repeat(3,1fr)}}
.role{display:flex;align-items:center;gap:12px;text-align:start;min-width:0;padding:14px;background:var(--paper);border:2px solid var(--line);border-radius:var(--r);color:var(--ink);font:inherit;cursor:pointer}
.role:hover{border-color:var(--ink)}
.role > span:last-child{min-width:0}
.role b{display:block;font-family:var(--font-display);font-size:18px}
.role span.sub{display:block;font-size:14px;color:var(--ink-2)}
.role .done{display:inline-block;margin-top:4px;font-size:13px;font-weight:700;color:var(--school)}
@media (min-width:600px){.role{flex-direction:column;align-items:flex-start}}
.codeform{display:flex;flex-wrap:wrap;gap:10px}
.codeform input{flex:1 1 180px;min-width:0;min-height:48px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:700 17px var(--font-display);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.msg{font-size:15px;font-weight:700}
.msg.bad{color:var(--home)}
.msg.ok{color:var(--school)}

/* spørsmål */
.who{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink-2)}
.steps{display:flex;gap:4px;margin-inline-start:auto}
.steps i{width:14px;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--ink)}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;text-align:start;background:var(--paper);border:2px solid var(--line);border-radius:var(--r);color:var(--ink);font:inherit;cursor:pointer}
.opt svg{flex:none}
.opt b{font-family:var(--font-display);font-size:18px}
.opt .hint{color:var(--ink-2);font-size:15px}
.opt .tick{margin-inline-start:auto;font-weight:700;visibility:hidden}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);background:var(--wash)}
.opt[aria-pressed="true"] .tick{visibility:visible}
.opt.plain{min-height:48px;border-style:dashed}
.keep{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.keep input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--rain)}

/* ferdig */
.codebox{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.code{font:800 22px var(--font-display);letter-spacing:.06em;font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all;margin-inline-end:auto;overflow-wrap:anywhere;min-width:0}
.callout{padding:14px 16px;border-radius:var(--r);border:2px solid var(--rain);background:var(--paper);display:flex;flex-direction:column;gap:6px}

/* annonseplass: bare på de voksnes skjermer */
.ad{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--wash);font-size:15px}
.ad .ad-l{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.ad a{color:var(--ink);text-decoration:none;display:flex;flex-direction:column;gap:2px}
.ad .ad-by{font-size:13.5px;color:var(--ink-2)}

/* resultat */
.banner{padding:10px 14px;border:2px dashed var(--line);border-radius:var(--r);font-size:15px}
.first{background:var(--ink);color:var(--sky);border-radius:var(--r);padding:18px;gap:8px}
.first .eyebrow{color:var(--sun)}
.first h2{font-size:24px}
.first .ask{font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.3}
.chart{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;gap:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink-2);padding-bottom:12px}
.legend > span{display:inline-flex;align-items:center;gap:6px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:6px}
.scale div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;line-height:1.2;text-align:center;color:var(--ink-2);min-width:0;overflow-wrap:anywhere;padding-inline:1px}
.row{display:flex;flex-direction:column;gap:8px;padding-block:14px;border-top:1px solid var(--line)}
.row-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}
.row-h h3{min-width:0}
.track{position:relative;display:grid;grid-template-columns:repeat(5,1fr)}
.track::before{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--line)}
.cell{position:relative;display:flex;justify-content:center;align-items:center;min-height:32px}
.cell::before{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--line)}
.cell .mk{position:relative}
.cell .mk + .mk{margin-inline-start:-5px}
.row-t{font-size:15.5px}
.row-ask{font-size:15.5px;color:var(--ink-2)}
.row-miss{font-size:14px;color:var(--ink-2);font-style:italic}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px 3px 8px;border-radius:999px;border:1.5px solid var(--line);max-width:100%}
.chip i{font-style:normal;font-family:var(--font-display);font-weight:800}
.chip-elevlav{background:var(--sun);color:var(--on-sun);border-color:var(--ink)}
.chip-felles{background:var(--rain);color:var(--paper);border-color:var(--rain)}
.chip-ulikt{border-color:var(--ink);color:var(--ink)}
.chip-skjult,.chip-blind,.chip-en{border-style:dashed;color:var(--ink-2)}
.chip-likt{color:var(--ink-2)}

/* tips */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px 6px 8px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);font:700 15px var(--font-body);cursor:pointer}
.tab[aria-selected="true"]{border-color:var(--ink);background:var(--paper)}
.tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.tips li{display:flex;flex-direction:column;gap:2px;padding-inline-start:14px;border-inline-start:3px solid var(--line)}
.tips li .eyebrow{font-size:12px}
.ladder{margin:0;padding-inline-start:24px;display:flex;flex-direction:column;gap:10px}
.ladder li::marker{font-family:var(--font-display);font-weight:800}

/* bunn */
.foot{border-top:2px solid var(--line);padding-top:24px;display:flex;flex-direction:column;gap:24px}
.help{display:grid;gap:12px}
.help div{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:baseline}
.help b{font:800 20px var(--font-display);font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all;white-space:nowrap}
.nots{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.src{font-size:14px;color:var(--ink-2)}
.w-sun{fill:var(--sun)} .w-ray{stroke:var(--sun);stroke-width:1.7;stroke-linecap:round;fill:none}
.w-cloud{fill:var(--cloud)} .w-cloud2{fill:var(--cloud-2)}
.w-drop{stroke:var(--rain);stroke-width:1.8;stroke-linecap:round;fill:none}
@media (prefers-reduced-motion:no-preference){.opt,.role,.btn,.tab,.segb{transition:border-color .12s,background-color .12s}}
</style>
</head>

  return '<g class="'+cls+'" transform="translate('+dx+' '+dy+')"><circle cx="8.5" cy="14" r="4"/><circle cx="13" cy="11.5" r="5"/><circle cx="17.5" cy="14.5" r="3.5"/><rect x="8.5" y="13" width="9" height="5"/></g>';
}
function rays(cx,cy,r1,r2,n){
  var s='';
  for(var i=0;i<n;i++){
    var a=Math.PI*2*i/n, c=Math.cos(a), d=Math.sin(a);
    s+='<line x1="'+(cx+c*r1).toFixed(2)+'" y1="'+(cy+d*r1).toFixed(2)+'" x2="'+(cx+c*r2).toFixed(2)+'" y2="'+(cy+d*r2).toFixed(2)+'"/>';
  }
  return '<g class="w-ray">'+s+'</g>';
}
function wx(n,size){
  var b='';
  if(n===5) b='<circle class="w-sun" cx="12" cy="12" r="4.6"/>'+rays(12,12,7.2,9.8,8);
  else if(n===4) b='<circle class="w-sun" cx="16.5" cy="8" r="3.6"/>'+rays(16.5,8,5.4,7.2,8)+cloud('w-cloud',-2,2.5);
  else if(n===3) b=cloud('w-cloud',-1,-1);
  else if(n===2) b=cloud('w-cloud2',-1,-4)+'<g class="w-drop"><line x1="8" y1="16.5" x2="7" y2="20.5"/><line x1="12.5" y1="16.5" x2="11.5" y2="20.5"/><line x1="17" y1="16.5" x2="16" y2="20.5"/></g>';
  else b=cloud('w-cloud2',-1,-5)+'<polygon class="w-sun" points="13.4,13.4 9.2,18.6 12,18.6 10.8,22.8 15.8,16.6 12.8,16.6 14.4,13.4"/>';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+b+'</svg>';
}

/* ---------- svarkode: rolle, alderstrinn, svar, (ønske), kontrollsiffer ---------- */
function checksum(r,d){
  var s=r.charCodeAt(0);
  for(var i=0;i<d.length;i++) s+=(i+3)*Number(d.charAt(i));
  return s%10;
}
function encode(r,band,arr,wish){
  var d=arr.filter(function(x){return x!==null&&x!==undefined;}).join('')+(r==='E'?String(wish||0):'');
  return r+band+'-'+d+'-'+checksum(r,String(band)+d);
}
function decode(str){
  var s=String(str||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  var r=s.charAt(0), band=Number(s.charAt(1));
  if(r!=='E'&&r!=='H'&&r!=='S') return null;
  if(!(band>=1&&band<=3)) return null;
  var rest=s.slice(2), d=rest.slice(0,-1), n=r==='E'?d.length-1:d.length;
  var okLen=r==='E'?(n===CORE||n===N):(n===N);
  if(!okLen||!/^[0-5]+$/.test(d)||!/^[0-9]$/.test(rest.slice(-1))) return null;
  if(checksum(r,String(band)+d)!==Number(rest.slice(-1))) return null;
  var arr=d.slice(0,n).split('').map(Number);
  while(arr.length<N) arr.push(null);
  return {role:r,band:band,arr:arr,wish:r==='E'?Number(d.charAt(n)):0};
}

/* ---------- sammenligning ---------- */
function has(A,r,i){return !!A[r]&&A[r][i]!==null&&A[r][i]!==undefined;}
function analyse(i,A){
  var v={},vals=[],adults=[],blind=[],shortE=false;
  ORDER.forEach(function(r){
    if(!A[r]) return;
    if(!has(A,r,i)){ if(r==='E') shortE=true; return; }
    v[r]=A[r][i];
    if(v[r]>0){vals.push(v[r]); if(r!=='E') adults.push(v[r]);}
    else if(r!=='E') blind.push(r);
  });
  var hidden=v.E===0;
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  var kind,dir='ulikt';
  if(vals.length<2) kind=hidden?'skjult':(blind.length?'blind':'en');
  else if(v.E>0&&v.E<=2&&adults.some(function(a){return a-v.E>=2;})) kind='elevlav';
  else if(max<=2) kind='felles';
  else if(max-min>=2){
    kind='ulikt';
    if(v.H>0&&v.S>0&&v.S-v.H>=2) dir='hjem';
    else if(v.H>0&&v.S>0&&v.H-v.S>=2) dir='skole';
    else if(v.E>0&&adults.length&&v.E-Math.max.apply(null,adults)>=2) dir='elevlys';
  }
  else if(hidden) kind='skjult';
  else if(blind.length) kind='blind';
  else kind='likt';
  var pri={elevlav:5,felles:4,ulikt:3,skjult:2,blind:1,en:0,likt:0}[kind];
  if(i===TRYGG&&pri>=3) pri+=0.5;
  return {i:i,kind:kind,dir:dir,pri:pri,blind:blind,hidden:hidden,shortE:shortE,v:v};
}
var CHIPG={elevlav:'!',felles:'↓',ulikt:'≠',skjult:'·',blind:'?',en:'1',likt:'='};
function chip(a){return '<span class="chip chip-'+a.kind+'"><i aria-hidden="true">'+CHIPG[a.kind]+'</i>'+D().chip[a.kind]+'</span>';}
function explain(a){return D().ex[a.kind==='ulikt'?a.dir:a.kind];}
function missing(a){
  var m=[];
  if(a.shortE) m.push(t('shortE'));
  if(a.hidden&&a.kind!=='skjult') m.push(t('hidE'));
  a.blind.forEach(function(r){m.push(t(r==='H'?'missH':'missS'));});
  return m.length?'<p class="row-miss">'+m.join(sp())+'</p>':'';
}
function track(a,A){
  var cells='';
  for(var n=1;n<=5;n++){
    cells+='<div class="cell">'+ORDER.filter(function(r){return has(A,r,a.i)&&A[r][a.i]===n;}).map(function(r){return mk(r);}).join('')+'</div>';
  }
  var label=ORDER.filter(function(r){return has(A,r,a.i);}).map(function(r){
    var x=A[r][a.i];
    return role(r).n+': '+(x?scaleName(x):t(r==='E'?'ariaKept':'ariaBlind'));
  }).join('. ');
  return '<div class="track" role="img" aria-label="'+esc(label)+'">'+cells+'</div>';
}
function scaleHead(){
  var s='';
  for(var n=1;n<=5;n++) s+='<div>'+wx(n,26)+'<span>'+scaleName(n)+'</span></div>';
  return '<div class="scale" aria-hidden="true">'+s+'</div>';
}
function legend(A){
  return '<div class="legend">'+ORDER.filter(function(r){return A[r];}).map(function(r){return '<span>'+mk(r)+role(r).n+'</span>';}).join('')+'</div>';
}
function chart(A,full,limit){
  var rows='';
  for(var i=0;i<(limit||N);i++){
    var a=analyse(i,A);
    rows+='<div class="row"><div class="row-h"><h3>'+area(i).n+'</h3>'+chip(a)+'</div>'+track(a,A)+missing(a)+
      (full?'<p class="row-t">'+explain(a)+'</p>'+(a.pri>=1&&a.kind!=='skjult'?'<p class="row-ask"><b>'+t('askL')+'</b> '+area(i).ask+'</p>':''):'')+'</div>';
  }
  return '<section class="chart">'+legend(A)+scaleHead()+rows+'</section>';
}
function forecast(A){
  var sum=0,c=0;
  ORDER.forEach(function(r){ if(A[r]) A[r].forEach(function(x){ if(x>0){sum+=x;c++;} }); });
  if(!c) return t('noneYet');
  return D().fc[Math.min(5,Math.max(1,Math.round(sum/c)))-1];
}

/* ---------- rekkefølgen i en runde ---------- */
function seq(){
  var s=[],i;
  if(state.role==='E'){
    for(i=0;i<CORE;i++) s.push({t:'q',i:i});
    s.push({t:'pause'});
    if(state.more) for(i=CORE;i<N;i++) s.push({t:'q',i:i});
    s.push({t:'wish'});
  } else {
    for(i=0;i<N;i++) s.push({t:'q',i:i});
  }
  return s;
}

      HELP_NUMS.map(function(n,i){return '<div><b dir="ltr">'+n+'</b><span>'+d.help[i]+'</span></div>';}).join('')+
    '</div><p class="small muted">'+t('helpIntl')+' <a href="https://childhelplineinternational.org/helplines/" dir="ltr">childhelplineinternational.org</a></p></section>'+
    '<section><h2>'+t('notsH')+'</h2><ul class="nots">'+d.nots.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul><div class="btnrow"><button class="btn ghost" data-act="terms">'+t('terms')+'</button></div></section>'+
    '<p class="src">'+t('src')+' <span dir="ltr"><a href="https://www.udir.no/lk20/overordnet-del/3.-prinsipper-for-skolens-praksis/3.3-samarbeid-mellom-hjem-og-skole">Udir 3.3</a> · <a href="https://www.udir.no/regelverk-og-tilsyn/skole-og-opplaring/rundskriv-om-skolemiljo/6.-skolen-har-en-aktivitetsplikt">Udir § 12-4</a> · <a href="https://www.116111.no/">116111.no</a></span></p>';
}
function applyLang(){
  var root=document.documentElement;
  root.lang=state.lang==='zh'?'zh-Hans':state.lang;
  root.dir=D().dir;
  sel.value=state.lang;
  sel.setAttribute('aria-label',t('lang'));
  brand.setAttribute('aria-label','Tre blikk. '+t('home'));
  renderFoot();
}
function render(keep){
  var v=state.view;
  app.innerHTML=v==='intro'?viewIntro():v==='ask'?viewAsk():v==='done'?viewDone():v==='result'?viewResult():viewHome();
  if(!keep){ try{window.scrollTo(0,0); app.focus({preventScroll:true});}catch(e){} }
}

/* ---------- handlinger ---------- */
function finish(){
  var r=state.role, d=state.draft, arr=[];
  for(var i=0;i<N;i++){
    var asked=r!=='E'||i<CORE||state.more;
    arr.push(asked?(state.hide[i]?0:d[i]):null);
  }
  state.ans[r]=arr;
  if(r==='E'){
    state.wish=state.wishDraft||0;
    state.hidden=d.filter(function(x,i){return x>0&&state.hide[i];}).length;
    state.heavy=d.some(function(x){return x===1;})||(d[TRYGG]>0&&d[TRYGG]<=2);
  }
  state.code=encode(r,state.band,arr,state.wish);
  state.view='done';
}
function act(name,el){
  if(name==='accept'){
    if(state.ck[0]&&state.ck[1]){state.accepted=true; state.view='home'; render();}
    return;
  }
  if(name==='terms'){state.accepted=false; state.ck=[false,false]; state.view='intro'; render(); return;}
  if(!state.accepted) return;
  if(name!=='reset') state.armed=false;
  var it, i;
  switch(name){
    case 'home': state.view='home'; state.example=false; state.msg=null; render(); break;
    case 'band':
      state.band=Number(el.getAttribute('data-band')); render(true);
      var bb=document.getElementById('trinn-'+state.band); if(bb) bb.focus();
      break;
    case 'start':
      state.role=el.getAttribute('data-role'); state.step=0; state.more=false; state.wishDraft=null;
      state.draft=[]; state.hide=[];
      for(i=0;i<N;i++){state.draft.push(null); state.hide.push(false);}
      state.view='ask'; state.msg=null; render(); break;
    case 'pick':
      var val=Number(el.getAttribute('data-val'));
      it=seq()[state.step];
      if(it.t==='q') state.draft[it.i]=val; else state.wishDraft=val;
      Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){b.setAttribute('aria-pressed',String(b===el));});
      var nx=document.getElementById('neste'); if(nx) nx.disabled=false;
      break;
    case 'more':
      state.more=el.getAttribute('data-val')==='1';
      if(!state.more) for(i=CORE;i<N;i++){state.draft[i]=null; state.hide[i]=false;}
      state.step++; render(); break;
    case 'next':
      if(state.step<seq().length-1){state.step++; render();} else {finish(); render();}
      break;
    case 'prev':
      if(state.step>0){state.step--;} else {state.view='home';}
      render(); break;
    case 'compare': if(answered().length>=2){state.view='result'; state.example=false; state.tab='E'; render();} break;
    case 'example': state.view='result'; state.example=true; state.tab='E'; render(); break;
    case 'tab':
      state.tab=el.getAttribute('data-role');
      var A=state.example?EXAMPLE:state.ans, list=[];
      for(i=0;i<N;i++) list.push(analyse(i,A));
      list.sort(function(a,b){return b.pri-a.pri||a.i-b.i;});
      document.getElementById('tips').innerHTML=tipsHtml(A,list);
      var tb=document.getElementById('tab-'+state.tab); if(tb) tb.focus();
      break;
    case 'reset':
      if(state.armed){state.ans={E:null,H:null,S:null}; state.wish=0; state.armed=false; state.msg=null;}
      else state.armed=true;
      render(true); break;
    case 'copy':
      var done=function(){el.textContent=t('copied');};
      var fallback=function(){
        try{var rg=document.createRange(); rg.selectNodeContents(document.getElementById('kode')); var s=window.getSelection(); s.removeAllRanges(); s.addRange(rg);}catch(e){}
        el.textContent=t('copySel');
      };
      try{navigator.clipboard.writeText(state.code).then(done,fallback);}catch(e){fallback();}
      break;
  }
}
document.addEventListener('click',function(ev){
  var el=ev.target.closest&&ev.target.closest('[data-act]');
  if(!el||el.disabled) return;
  act(el.getAttribute('data-act'),el);
});
document.addEventListener('change',function(ev){
  var x=ev.target; if(!x) return;
  if(x.id==='hold-privat'&&state.view==='ask'){
    var it=seq()[state.step];
    if(it&&it.t==='q') state.hide[it.i]=x.checked;
  }
  if(x.id==='vilkar-1'||x.id==='vilkar-2'){
    state.ck[x.id==='vilkar-1'?0:1]=x.checked;
    var g=document.getElementById('godta'); if(g) g.disabled=!(state.ck[0]&&state.ck[1]);
  }
  if(x.id==='sprak'&&L[x.value]){
    state.lang=x.value; state.msg=null;
    try{localStorage.setItem('tb-lang',state.lang);}catch(e){}
    applyLang(); render(true);
  }
});
document.addEventListener('submit',function(ev){
  ev.preventDefault();
  var inp=document.getElementById('svarkode'); if(!inp) return;
  var res=decode(inp.value);
  if(!res) state.msg=['bad',t('codeBad')];
  else {
    var note='';
    if(!answered().length) state.band=res.band;
    else if(res.band!==state.band) note=sp()+t('codeBand',{band:D().bands[res.band-1]});
    state.ans[res.role]=res.arr;
    if(res.role==='E') state.wish=res.wish;
    state.msg=['ok',t('codeOk',{who:role(res.role).l})+note];
  }
  state.armed=false;
  render(true);
});

function start(data){
  try{
    if(data&&data.ans&&data.view&&data.band){ for(var k in data){ if(Object.prototype.hasOwnProperty.call(state,k)) state[k]=data[k]; } }
    if(!L[state.lang]) state.lang='nb';
    if(!state.accepted) state.view='intro';
  }catch(e){}
  sel.innerHTML=LANG_ORDER.map(function(c){return '<option value="'+c+'" lang="'+(c==='zh'?'zh-Hans':c)+'">'+L[c].name+'</option>';}).join('');
  applyLang();
  render(true);
}
var hot=window.claude&&window.claude.hot;
try{ if(hot&&hot.snapshot) hot.snapshot(function(){return state;}); }catch(e){}
if(hot&&hot.ready) hot.ready(start); else start((hot&&hot.data)||{});

})();
</script>
